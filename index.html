<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Browser</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #202124;
            color: white;
            overflow: hidden;
        }

        .toolbar {
            height: 55px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: #292a2d;
        }

        button {
            border: none;
            background: #3c4043;
            color: white;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #505256;
        }

        #url {
            flex: 1;
            height: 38px;
            border: none;
            outline: none;
            border-radius: 20px;
            padding: 0 16px;
            font-size: 15px;
            background: #3c4043;
            color: white;
        }

        #browser {
            width: 100%;
            height: calc(100vh - 55px);
            border: none;
        }
    </style>
</head>

<body>

    <div class="toolbar">
        <button id="back">←</button>
        <button id="forward">→</button>
        <button id="reload">⟳</button>

        <input
            id="url"
            placeholder="Search or enter a URL"
        />

        <button id="go">Go</button>
    </div>

    <webview
        id="browser"
        src="https://www.google.com">
    </webview>

    <script src="renderer.js"></script>

</body>
</html>
